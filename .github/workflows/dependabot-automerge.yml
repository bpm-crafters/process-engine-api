name: Dependabot auto-merge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:

      - name: Fetch Dependabot metadata
        id: meta
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Merge successful patch and minor updates
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        run: |
          for i in {1..180}; do
            check_run="$(gh api "repos/$GITHUB_REPOSITORY/commits/$HEAD_SHA/check-runs" \
              --jq '.check_runs | map(select(.name == "Build and run tests")) | sort_by(.started_at) | last // empty')"

            if [[ -z "$check_run" ]]; then
              echo "Build and run tests has not started yet (attempt $i)."
              sleep 15
              continue
            fi

            status="$(jq -r '.status' <<<"$check_run")"
            conclusion="$(jq -r '.conclusion // empty' <<<"$check_run")"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" != "success" ]]; then
                echo "Build and run tests completed with conclusion: $conclusion"
                exit 1
              fi

              current_head="$(gh pr view "$PR_URL" --json headRefOid --jq '.headRefOid')"
              if [[ "$current_head" != "$HEAD_SHA" ]]; then
                echo "The pull request changed while its build ran; a new workflow run will evaluate the new head."
                exit 0
              fi

              gh pr merge --squash "$PR_URL"
              exit 0
            fi

            echo "Build and run tests is $status (attempt $i)."
            sleep 15
          done
          echo "Timed out waiting for Build and run tests."
          exit 1
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
