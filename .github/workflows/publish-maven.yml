name: Publish to Maven Central

# Reusable publish job — the same build/sign/deploy steps the old master.yml ran, now driven
# by release-please (workflow_call) or triggerable standalone (workflow_dispatch). `dry_run`
# builds & verifies without deploying. As workflow_call this file is org-wide reusable.
on:
  workflow_call:
    inputs:
      dry_run:
        description: "Build & verify only, no real publish"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Build & verify only, no real publish"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  publish:
    name: Build, sign & deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.0

      # Setup JDK and .m2/settings.xml for Maven Central
      - name: Set up JDK
        uses: actions/setup-java@v5.4.0
        with:
          java-version-file: .java-version
          distribution: 'zulu'
          cache: maven
          server-id: central
          server-username: OSS_CENTRAL_USERNAME # env variable for Maven Central
          server-password: OSS_CENTRAL_PASSWORD # env variable for Maven Central

      - name: Prepare Maven Wrapper
        run: chmod +x ./mvnw

      - name: Build with Maven
        run: ./mvnw clean verify -U -B -T4

      # Import the signing key into GPG
      - name: Import GPG Owner Trust
        run: echo "${{ secrets.GPG_OWNERTRUST }}" | base64 --decode | gpg --import-ownertrust

      - name: Import GPG key
        run: echo "${{ secrets.GPG_SECRET_KEYS }}" | base64 --decode | gpg --import --no-tty --batch --yes --always-trust

      - name: Deploy a new release version to Maven Central
        if: ${{ !inputs.dry_run }}
        run: ./mvnw clean deploy -B -ntp -DskipTests -DskipExamples -Prelease -Dgpg.keyname="${{ secrets.GPG_KEYNAME }}"
        env:
          OSS_CENTRAL_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          OSS_CENTRAL_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
